<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TunixBot Activity</title>
    <link rel="stylesheet" href="/activity.css" />
  </head>
  <body>
    <main class="activity-shell">
      <div class="activity-card">
        <div class="badge">Discord Activity</div>
        <h1>TunixBot Dashboard</h1>
        <p id="activityStatus" class="status">Starting Activity...</p>
        <div class="actions">
          <a id="openDashboardBtn" class="btn ghost hidden" href="/" target="_blank" rel="noopener noreferrer">
            Open Web Dashboard
          </a>
          <button id="retryBtn" class="btn hidden" type="button">Retry</button>
        </div>
        <p class="hint">
          Tip: run <b>/join</b> in your voice channel before opening the Activity.
        </p>
      </div>
    </main>

    <script src="/activity.js" type="module"></script>
  </body>
</html>
